<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>금곡BC 입단 안내</title>
<style>
:root {
--bg-color: #0f172a;
--card-bg: #1e293b;
--accent-color: #38bdf8;
--text-color: #f8fafc;
--talk-yellow: #fee500;
--talk-text: #000000;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
}

body {
background-color: var(--bg-color);
color: var(--text-color);
display: flex;
justify-content: center;
padding: 20px;
min-height: 100vh;
}

.container {
width: 100%;
max-width: 500px;
display: flex;
flex-direction: column;
gap: 20px;
}

/* 헤더 / 프로필 섹션 */
.profile-card {
background: var(--card-bg);
padding: 24px;
border-radius: 20px;
text-align: center;
box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.profile-avatar {
width: 80px;
height: 80px;
border-radius: 50%;
background: linear-gradient(135deg, #1e40af, #3b82f6);
margin: 0 auto 12px;
display: flex;
align-items: center;
justify-content: center;
font-size: 36px;
}

.profile-name {
font-size: 1.5rem;
font-weight: 800;
margin-bottom: 6px;
color: #ffffff;
}

.profile-bio {
color: #94a3b8;
font-size: 0.95rem;
line-height: 1.5;
}

/* 금곡BC 입단 문의 버튼 */
.inquiry-btn {
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
background-color: var(--talk-yellow);
color: var(--talk-text);
padding: 16px;
border: none;
border-radius: 14px;
font-size: 1.1rem;
font-weight: 700;
cursor: pointer;
width: 100%;
box-shadow: 0 4px 12px rgba(254, 229, 0, 0.2);
transition: transform 0.2s, background-color 0.2s;
}

.inquiry-btn:active {
transform: scale(0.98);
}

/* 모달 팝업 */
.modal-overlay {
display: none;
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.7);
backdrop-filter: blur(4px);
justify-content: center;
align-items: center;
z-index: 1000;
padding: 20px;
}

.modal-content {
background: var(--card-bg);
border-radius: 20px;
padding: 24px;
max-width: 400px;
width: 100%;
text-align: center;
box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
